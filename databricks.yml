# The bundle: everything Databricks needs (jobs, and later pipelines, alerts and
# dashboards) defined as code, so no one clicks anything together in the UI.
# Docs: https://docs.databricks.com/aws/en/dev-tools/bundles/settings
bundle:
  name: analytics-platform

include:
  - resources/*.yml

artifacts:
  analytics_platform:
    type: whl
    build: uv build --wheel
    path: .

variables:
  catalog:
    description: The Unity Catalog catalog this target writes to (ADR 0001).
  warehouse_id:
    description: The SQL warehouse dbt runs on (Free Edition's Serverless Starter Warehouse). Not a secret.
    default: 63496ac182465c07
  schema_separator:
    description: Dev only. The bundle drops name_prefix's trailing "_" for schemas, so dev puts it back.
    default: ""
  gold_schema:
    description: Where dbt builds Gold. Not a bundle resource (dbt creates it), so dev names it by hand.
    default: gold

targets:
  dev:
    # `mode: development` prefixes every resource with your name and pauses
    # schedules, so your experiments never collide with anyone else's.
    mode: development
    default: true
    # Dev names become dbt_<you>_landing / dbt_<you>_bronze, matching dbt's dbt_<you>_silver / _gold.
    presets:
      name_prefix: dbt_${workspace.current_user.short_name}_
    variables:
      catalog: dev
      schema_separator: _
      gold_schema: dbt_${workspace.current_user.short_name}_gold

  staging:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: acb14c44-9506-4f19-9375-e0b223869d04
    variables:
      catalog: staging

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: a8ff1413-0ca6-426d-a62f-8c264d455332
    variables:
      catalog: prod