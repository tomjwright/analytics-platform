name: deploy

# Merging to main deploys to staging, runs the job, then waits for approval
# before deploying the same commit to prod (ADR 0002).
#
# Hints:
#   - The Databricks CLI reads DATABRICKS_HOST, DATABRICKS_CLIENT_ID and
#     DATABRICKS_CLIENT_SECRET from the environment and logs in as the service
#     principal. No `databricks configure` step, and never a personal token.
#   - A job can only read an Environment's secrets once it declares
#     `environment:`. That is also what triggers the prod approval.
#   - Pass secrets through `env:`, never by pasting ${{ secrets.X }} into `run:`.
#   - Install the CLI with databricks/setup-cli, pinned to a full commit SHA
#     like the other actions.


on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two merges in a row queue up instead of cancelling a half-finished deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
    staging:
      runs-on: ubuntu-latest
      environment: staging
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
        DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        - uses: databricks/setup-cli@e1dad86b08f6ea07707aea128ec4bfa76af8db55 # v1.28.0
        - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        - run: databricks bundle validate --target staging
        - run: databricks bundle deploy --target staging
        - run: databricks bundle run customer_tracer --target staging
        - name: Publish the manifest for slim CI
          run: |
            cd dbt
            DBT_PROFILES_DIR=. uv run dbt parse --target staging
            cd ..
            databricks fs cp dbt/target/manifest.json dbfs:/Volumes/staging/ops/artifacts/manifest.json --overwrite
    prod:
      runs-on: ubuntu-latest
      environment: prod
      needs: staging
      permissions:
        contents: write
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
        DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        - uses: databricks/setup-cli@e1dad86b08f6ea07707aea128ec4bfa76af8db55 # v1.28.0
        - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        - run: databricks bundle validate --target prod
        - run: databricks bundle deploy --target prod
        - run: databricks bundle run customer_tracer --target prod
        - name: Tag the prod release
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            GITHUB_SHA=$(git rev-parse HEAD)
            tag=$(uv run python -m analytics_platform.cicd tag "$GITHUB_SHA" "$(date -u +%F)")
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
