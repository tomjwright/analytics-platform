name: rollback

# Ticket 06: redeploy an earlier prod tag, and optionally restore Gold's data, behind the prod approval.
# Run it from Actions -> rollback -> Run workflow, or `gh workflow run rollback -f tag=prod-...`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The prod tag to roll back to, e.g. prod-2026-11-27-58b8181
        required: true
        type: string
      restore_run_id:
        description: Optional. Restore Gold to how it was before this customer_tracer run id
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Shares deploy.yml's group, so a rollback never overlaps a deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      TAG: ${{ inputs.tag }}
      RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TODO(ticket 06): the rest of the steps, in this order.
      # 1. setup-uv (pinned, copy from deploy.yml), then check the tag:
      #    uv run python -m analytics_platform.cicd check-tag "$TAG"
      #    Why check before checking out? What could `tag: main` or `tag: some-unreviewed-branch` deploy?
      # 2. A second actions/checkout with `ref: ${{ inputs.tag }}` and persist-credentials: false.
      #    `with:` is safe for ${{ }}; `run:` is not (script injection). That's why TAG is in env: above.
      # 3. setup-cli (pinned), then bundle validate and bundle deploy, both --target prod.
      # 4. "Restore Gold": only `if: inputs.restore_run_id != ''`. Run
      #    databricks bundle run restore_gold --target prod --params "run_id=$RESTORE_RUN_ID"
      - run: echo "TODO(ticket 06)" && exit 1
