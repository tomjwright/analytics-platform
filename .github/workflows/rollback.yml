name: rollback

# Ticket 06: redeploy an earlier prod tag, and optionally restore Gold's data, behind the prod approval.
# Run it from Actions -> rollback -> Run workflow, or `gh workflow run rollback -f tag=prod-...`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The prod tag to roll back to, e.g. prod-2026-11-27-58b8181
        required: true
        type: string
      restore_run_id:
        description: Optional. Restore Gold to how it was before this customer_tracer run id
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Shares deploy.yml's group, so a rollback never overlaps a deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      TAG: ${{ inputs.tag }}
      RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      
      - name: Check the tag
        run: uv run python -m analytics_platform.cicd check-tag "$TAG"
      
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      
      - uses: databricks/setup-cli@e1dad86b08f6ea07707aea128ec4bfa76af8db55 # v1.28.0
      
      - name: Validate prod bundle
        run: databricks bundle validate --target prod
      
      - name: Deploy prod bundle
        run: databricks bundle deploy --target prod
      
      - name: Restore Gold
        if: inputs.restore_run_id != ''
        run: databricks bundle run restore_gold --target prod --params "run_id=$RESTORE_RUN_ID"

