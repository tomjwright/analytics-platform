# One output per bundle target. On Databricks the dbt task sets DBT_HOST and
# DBT_ACCESS_TOKEN itself; locally you export them (see the PR for the commands).
analytics_platform:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DBT_HOST', 'dbc-c2df7d53-3a0b.cloud.databricks.com') }}"
      http_path: /sql/1.0/warehouses/63496ac182465c07
      token: "{{ env_var('DBT_ACCESS_TOKEN', 'placeholder') }}"
      catalog: dev
      # dbt_<you>: the job passes --vars "{dev_user: ...}"; locally, export DBT_DEV_USER.
      schema: "dbt_{{ var('dev_user', env_var('DBT_DEV_USER', 'dev')) }}"
    staging:
      type: databricks
      host: "{{ env_var('DBT_HOST', 'dbc-c2df7d53-3a0b.cloud.databricks.com') }}"
      http_path: /sql/1.0/warehouses/63496ac182465c07
      token: "{{ env_var('DBT_ACCESS_TOKEN', 'placeholder') }}"
      catalog: staging
      schema: default
    prod:
      type: databricks
      host: "{{ env_var('DBT_HOST', 'dbc-c2df7d53-3a0b.cloud.databricks.com') }}"
      http_path: /sql/1.0/warehouses/63496ac182465c07
      token: "{{ env_var('DBT_ACCESS_TOKEN', 'placeholder') }}"
      catalog: prod
      schema: default
    # TODO(ticket 05): a `ci` output for slim CI on GitHub Actions.
    # - Same host and http_path as above, catalog staging.
    # - schema: ci_pr_<n>, with <n> from env_var('DBT_PR_NUMBER'). Give it a default so `dbt parse` works offline.
    # - Log in as the staging service principal with OAuth M2M, no token: auth_type oauth, plus client_id and
    #   client_secret from the DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET env vars the workflow already sets.
    #   (Defaults again, so parsing never needs the real secret.)
    # Docs: https://docs.getdbt.com/docs/core/connect-data-platform/databricks-setup
