# Platform plumbing that isn't Customer data: build artifacts now, run logs and monitoring later.
#
# TODO(ticket 05): an `ops` schema with an `artifacts` volume in it. Copy the shape of `landing` and its
# `files` volume in customer_tracer_job.yml (including ${var.schema_separator}, so dev gets dbt_<you>_ops).
# Staging's deploy writes its dbt manifest to /Volumes/staging/ops/artifacts/manifest.json, and slim CI reads it.
resources:
  schemas:
    ops:
      catalog_name: ${var.catalog}
      name: ${var.schema_separator}ops
      comment: Build artifacts (staging's dbt manifest) for slim CI.

  volumes:
    artifacts:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.ops.name}
      name: artifacts
      volume_type: MANAGED
